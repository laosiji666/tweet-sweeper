name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          {
            echo "storeFile=release.keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
          chmod 600 release.keystore keystore.properties

      - name: Resolve version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=" >> "$GITHUB_ENV"
          fi

      - name: Unit tests
        run: ./gradlew testReleaseUnitTest --no-daemon

      - name: Build release APK
        run: |
          if [ -n "$VERSION" ]; then
            CODE=$(echo "$VERSION" | awk -F. '{printf "%d%02d%02d", $1, $2, $3}')
            echo "versionName=$VERSION versionCode=$CODE"
            ./gradlew assembleRelease --no-daemon -PversionName="$VERSION" -PversionCode="$CODE"
          else
            ./gradlew assembleRelease --no-daemon
          fi

      - name: Verify signature
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          BT=$(ls $ANDROID_HOME/build-tools | tail -1)
          $ANDROID_HOME/build-tools/$BT/apksigner verify --print-certs "$APK" | tee /tmp/certs.txt
          cp "$APK" TweetSweeper.apk
          sha256sum TweetSweeper.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: TweetSweeper.apk
          name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TweetSweeper-release
          path: TweetSweeper.apk
          if-no-files-found: error
